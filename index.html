<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Print Studio & Sklep</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f6f9; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1, h2 { color: #1a73e8; }
        .product-card { display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; padding: 12px 15px; border-radius: 8px; border: 1px solid #e1e4e8; margin-bottom: 10px; }
        button { background: #1a73e8; color: white; border: none; padding: 8px 14px; cursor: pointer; border-radius: 6px; font-weight: bold; }
        button:hover { background: #1557b0; }
        .cart-section { background: #e8f0fe; padding: 15px; border-radius: 8px; margin-top: 20px; }
        .cart-list { list-style: none; padding: 0; margin: 0 0 15px 0; }
        .cart-item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dashed #d2e3fc; }
        .form-group { margin-top: 15px; }
        input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; }
        .total { font-size: 16px; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>3D Print Studio & Sklep</h1>
    <p>Wybierz produkty z druku 3D:</p>
    
    <div class="product-card">
        <div><strong>iPhone 13</strong><br><span>15 zł</span></div>
        <button onclick="dodajDoKoszyka('iPhone 13', 15)">Dodaj</button>
    </div>

    <div class="product-card">
        <div><strong>iPhone 16 (Basic)</strong><br><span>15 zł</span></div>
        <button onclick="dodajDoKoszyka('iPhone 16 (Basic)', 15)">Dodaj</button>
    </div>

    <div class="product-card">
        <div><strong>iPhone 17 Pro Max</strong><br><span>20 zł</span></div>
        <button onclick="dodajDoKoszyka('iPhone 17 Pro Max', 20)">Dodaj</button>
    </div>
    
    <div class="product-card">
        <div><strong>iPhone 17 Pro Max Camera Bump</strong><br><span>25 zł</span></div>
        <button onclick="dodajDoKoszyka('iPhone 17 Pro Max Camera Bump', 25)">Dodaj</button>
    </div>

    <div class="product-card">
        <div><strong>iPhone 17 Pro Max Full</strong><br><span>30 zł</span></div>
        <button onclick="dodajDoKoszyka('iPhone 17 Pro Max Full', 30)">Dodaj</button>
    </div>

    <div class="product-card">
        <div><strong>Kostka NeeDoh (pomarańczowa)</strong><br><span>25 zł</span></div>
        <button onclick="dodajDoKoszyka('Kostka NeeDoh (pomarańczowa)', 25)">Dodaj</button>
    </div>

    <div class="cart-section">
        <h2>Twój Koszyk</h2>
        <ul id="lista-koszyka" class="cart-list">
            <li>Brak produktów w koszyku.</li>
        </ul>
        <div class="total">Suma: <span id="suma">0</span> zł</div>
        
        <div class="form-group">
            <label for="imie_kolegi"><strong>Imię kolegi (kto zamówił):</strong></label>
            <input type="text" id="imie_kolegi" placeholder="Wpisz imię kolegi...">
        </div>
        
        <button style="margin-top: 15px; width: 100%; background: #34a853;" onclick="zlozZamowienie()">Złóż zamówienie</button>
    </div>
</div>

<script>
    let koszyk = [];

    function dodajDoKoszyka(nazwa, cena) {
        koszyk.push({ nazwa, cena });
        aktualizujKoszyk();
    }

    function aktualizujKoszyk() {
        const lista = document.getElementById('lista-koszyka');
        const sumaEl = document.getElementById('suma');
        
        if (koszyk.length === 0) {
            lista.innerHTML = '<li>Brak produktów w koszyku.</li>';
            sumaEl.innerText = '0';
            return;
        }

        lista.innerHTML = '';
        let suma = 0;
        koszyk.forEach(item => {
            suma += item.cena;
            lista.innerHTML += `<li class="cart-item"><span>${item.nazwa}</span> <span>${item.cena} zł</span></li>`;
        });
        sumaEl.innerText = suma;
    }

    function zlozZamowienie() {
        const imieKolegi = document.getElementById('imie_kolegi').value.trim();
        
        if (!imieKolegi) {
            alert('Wpisz imię kolegi, żeby wiedzieć, kto zamówił!');
            document.getElementById('imie_kolegi').focus();
            return;
        }
        
        if (koszyk.length === 0) {
            alert('Koszyk jest pusty!');
            return;
        }

        alert(`Zamówienie przyjęte!\nZamawiający: ${imieKolegi}\nDo zapłaty: ${document.getElementById('suma').innerText} zł`);
        
        koszyk = [];
        document.getElementById('imie_kolegi').value = '';
        aktualizujKoszyk();
    }
</script>

</body>
</html>
